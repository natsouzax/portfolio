<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 188"
     width="690" height="188" role="img" aria-labelledby="odev-title odev-desc">
  <title id="odev-title">odevntzn</title>
  <desc id="odev-desc">Três facetas fecham em torno de um núcleo triangular e revelam o nome odevntzn.</desc>
  <style>
    .odev-background { fill: var(--odev-background, transparent); }
    .odev-place, .odev-facet, .odev-window, .odev-letters, .odev-symbol {
      animation-duration: 2.4s;
      animation-fill-mode: both;
    }
    .odev-place { animation-name: odev-place; animation-timing-function: cubic-bezier(.65, 0, .2, 1); }
    .odev-symbol { fill: currentColor; color: #FFFFFF; animation-name: odev-pulse; }
    .odev-facet {
      transform-origin: 48px 52px;
      animation-name: odev-close;
      animation-timing-function: cubic-bezier(.45, .05, .22, 1);
    }
    .odev-left { --dx: -28px; --dy: -13px; --turn: -19deg; }
    .odev-right { --dx: 28px; --dy: -14px; --turn: -19deg; }
    .odev-base { --dx: 0px; --dy: 29px; --turn: -19deg; }
    .odev-window { animation-name: odev-reveal; animation-timing-function: cubic-bezier(.2, .65, .2, 1); }
    .odev-letters { fill: #FFFFFF; animation-name: odev-letters; animation-timing-function: ease-out; }

    @keyframes odev-close {
      0%, 7% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--turn)); }
      18% { opacity: 1; transform: translate(var(--dx), var(--dy)) rotate(var(--turn)); }
      45% { opacity: 1; transform: translate(calc(var(--dx) * -.07), calc(var(--dy) * -.07)) rotate(1deg); }
      51%, 100% { opacity: 1; transform: translate(0, 0) rotate(0); }
    }
    @keyframes odev-pulse {
      0%, 42%, 60%, 100% { color: #FFFFFF; }
      48% { color: #C8FF70; }
    }
    @keyframes odev-place {
      0%, 53% { transform: translateX(244px); }
      82%, 100% { transform: translateX(0); }
    }
    @keyframes odev-reveal {
      0%, 65% { transform: scaleX(0); }
      92%, 100% { transform: scaleX(1); }
    }
    @keyframes odev-letters {
      0%, 65% { opacity: 0; transform: translateX(-9px); }
      89%, 100% { opacity: 1; transform: translateX(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .odev-place, .odev-facet, .odev-window, .odev-letters, .odev-symbol { animation: none; }
    }
  </style>

  <defs>
    <clipPath id="odev-name-window">
      <rect class="odev-window" x="0" y="0" width="525" height="68"/>
    </clipPath>
  </defs>

  <rect class="odev-background" width="690" height="188"/>

  <g transform="translate(53 52.5)">
    <g class="odev-place">
      <g class="odev-symbol">
        <path class="odev-facet odev-left" d="M1 81 45.5 3.5 50.5 35Z"/>
        <path class="odev-facet odev-right" d="M50 0 95 79.5 63.5 61Z"/>
        <path class="odev-facet odev-base" d="M4.5 83 32.5 62 91 83Z"/>
      </g>
    </g>
  </g>

  <g transform="translate(168 63.5) scale(.91)" clip-path="url(#odev-name-window)">
    <g class="odev-letters" fill-rule="evenodd">
      <!-- o -->
      <path d="M9 23H49L58 32V55L49 64H9L0 55V32ZM13 34 11 36V51L13 53H45L47 51V36L45 34Z"/>
      <!-- d -->
      <path transform="translate(68)" d="M9 23H47V4H58V64H9L0 55V32ZM13 34 11 36V51L13 53H47V34Z"/>
      <!-- e -->
      <path transform="translate(136)" d="M9 23H49L58 32V48H11V51L13 54H58V64H9L0 55V32ZM13 33 11 35V39H47V35L45 33Z"/>
      <!-- v -->
      <path transform="translate(202)" d="M0 23H13L29 51 45 23H58L34 64H24Z"/>
      <!-- n -->
      <path transform="translate(269)" d="M0 23H46L56 33V64H45V37L42 34H11V64H0Z"/>
      <!-- t -->
      <path transform="translate(335)" d="M4 10H15V23H46V34H15V48L20 53H46V64H15L4 53Z"/>
      <!-- z -->
      <path transform="translate(392)" d="M1 23H54V33L19 53H54V64H0V54L35 34H1Z"/>
      <!-- n -->
      <path transform="translate(456)" d="M0 23H46L56 33V64H45V37L42 34H11V64H0Z"/>
    </g>
  </g>
</svg>

